name: Mide Chatbot Dev 💵💴💶💷

# Workflow desactivado temporalmente - servidor interno no accesible desde GitHub Actions
# Reactivar cuando se configure self-hosted runner o cuando haya acceso externo al servidor
# on:
#   push:
#     branches:
#       - dev
jobs:
  run_pull:
    name: run pull 
    runs-on: ubuntu-latest

    steps:
      - name: install ssh keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Usar printf en lugar de echo para mejor manejo de saltos de línea
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Debug: verificar que la clave se escribió
          echo "SSH key tamaño: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "Primeras líneas:"
          head -3 ~/.ssh/id_rsa
          echo "Últimas líneas:"
          tail -2 ~/.ssh/id_rsa
          
          # Agregar el servidor a known_hosts (con el puerto correcto)
          echo "Escaneando servidor en puerto 11725..."
          ssh-keyscan -p 11725 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>&1 || echo "⚠️ ssh-keyscan falló"
          chmod 600 ~/.ssh/known_hosts
          
          echo "known_hosts:"
          cat ~/.ssh/known_hosts
          
      - name: test ssh connection
        run: |
          echo "Intentando conexión SSH..."
          ssh -v -p 11725 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "whoami"
          
      - name: connect and pull
        run: | 
          ssh -p 11725 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "cd code/mide-chatbot && git checkout dev \
          && git pull origin dev \
          && source venv/bin/activate \
          && pip install -r requirements.txt \
          && exit"
          
      - name: cleanup
        run: rm -rf ~/.ssh